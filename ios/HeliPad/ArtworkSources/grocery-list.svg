    <path class="ink" d="M30 49L157 49L144 118L51 124Z" />
    <path class="mid" d="M39 67L151 65M44 85L148 82M48 103L145 99" />
    <path class="mid" d="M55 51L63 119M78 50L83 121M102 50L104 120M128 49L126 118" />
    <path class="ink" d="M52 124L45 140L146 140" />
    <circle class="ink" cx="62" cy="154" r="10" />
    <circle class="ink" cx="136" cy="154" r="10" />
