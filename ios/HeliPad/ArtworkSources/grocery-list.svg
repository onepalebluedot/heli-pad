    <path class="mid" d="M46 38C38 20 40 4 51 1C64 8 69 24 65 42" />
    <path class="fine" d="M50 8L58 35M45 17L55 22M52 28L61 31" />
    <path class="mid" d="M68 41C67 25 75 18 83 20C91 22 95 31 93 42" />
    <path class="mid" d="M88 40C88 26 97 19 107 23C114 26 116 33 114 41" />
    <path class="mid" d="M120 42L125 10L145 17L149 44" />
    <path class="fine" d="M126 11L143 14L138 3L128 1Z" />

