    <path class="fine" d="M22 132L38 137M40 123C60 118 79 108 92 95" />

    <path class="ink" d="M116 23C121 51 114 85 96 114C85 132 73 143 76 155C87 164 103 165 118 158C145 145 162 116 164 84C165 57 150 35 128 20" />
    <path class="mid" d="M85 151C110 145 132 124 142 98C151 76 146 51 132 32" />
    <path class="fine" d="M80 151L96 157M102 141C120 128 134 110 140 91" />

    <path class="ink" d="M127 21C145 40 158 61 165 85C174 119 166 151 143 176C134 186 133 197 143 203C157 205 173 197 184 185C208 158 214 119 199 82C187 53 162 30 135 17" />
    <path class="mid" d="M145 192C170 175 187 148 190 119C193 89 180 57 154 34" />
    <path class="fine" d="M142 198L157 200M164 176C177 158 185 137 186 114" />

    <path class="ink" d="M136 20C163 31 187 49 202 73C223 107 223 146 205 177C198 189 199 199 210 204C224 201 236 189 242 176C258 140 250 100 225 67C204 40 171 23 141 16" />
    <path class="mid" d="M211 192C229 166 235 136 226 107C218 78 197 51 168 34" />
    <path class="fine" d="M207 199L220 198M223 175C231 154 232 132 226 111" />
  </g>
</svg>
