    <path class="mid" d="M120 137L159 130" />
    <path class="mid" d="M118 154L153 149" />
    <path class="mid" d="M116 171L150 166" />
    <path class="fine" d="M111 227L151 183M119 232L157 191M132 230L158 201" />
    <path class="fine" d="M145 82L165 101M151 78L171 97M139 87L158 105" />
  </g>

  <!-- Tiny shopping cart filled with groceries -->
  <g transform="translate(278 491) rotate(-4 100 80)">
