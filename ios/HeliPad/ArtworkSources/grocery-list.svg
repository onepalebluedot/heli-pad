<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Hand-drawn grocery list illustration</title>
  <desc id="desc">A smiling milk carton, spiral grocery list, shopping cart, and bunch of bananas in playful black line art.</desc>

  <style>
    .ink { stroke: currentColor; fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .mid { stroke: currentColor; fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .fine { stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: currentColor; stroke: none; }
    .words { fill: currentColor; font-family: "Marker Felt", "Comic Sans MS", "Bradley Hand", cursive; }
  </style>

  <!-- Back page and notebook -->
  <g transform="rotate(-3 690 370)">
    <rect class="ink" x="472" y="134" width="453" height="478" rx="7" />
    <rect class="ink" x="457" y="123" width="453" height="478" rx="7" />

    <!-- Ruled paper -->
    <path class="fine" d="M505 251C609 249 771 249 875 251" />
    <path class="fine" d="M505 294C615 292 773 292 875 294" />
    <path class="fine" d="M505 337C611 335 775 335 875 337" />
    <path class="fine" d="M505 380C617 378 778 378 875 380" />
    <path class="fine" d="M505 423C618 421 775 421 875 423" />
    <path class="fine" d="M505 466C612 464 774 464 875 466" />
    <path class="fine" d="M505 509C617 507 777 507 875 509" />
    <path class="fine" d="M505 552C618 550 775 550 875 552" />
    <path class="fine" d="M505 595C618 593 775 593 875 595" />

    <!-- Title -->
    <text class="words" x="510" y="215" font-size="51" font-weight="700" letter-spacing="1">GROCERY LIST</text>
    <path class="mid" d="M505 229C612 225 756 227 878 229" />

    <!-- List checks -->
    <g class="ink" stroke-width="6">
      <path d="M509 264L519 276L538 252" />
      <path d="M509 307L519 319L538 295" />
      <path d="M509 350L519 362L538 338" />
      <path d="M509 393L519 405L538 381" />
      <path d="M509 436L519 448L538 424" />
      <path d="M509 479L519 491L538 467" />
      <path d="M509 522L519 534L538 510" />
      <path d="M509 565L519 577L538 553" />
    </g>

    <!-- Hand-lettered grocery items -->
    <g class="words" font-size="36" font-weight="500">
      <text x="548" y="279" transform="rotate(-1 548 279)">Milk</text>
      <text x="548" y="322" transform="rotate(1 548 322)">Bread</text>
      <text x="548" y="365" transform="rotate(-1 548 365)">Eggs (doz.)</text>
      <text x="548" y="408" transform="rotate(1 548 408)">Bananas</text>
      <text x="548" y="451" transform="rotate(-1 548 451)">Apples</text>
      <text x="548" y="494" transform="rotate(1 548 494)">Veggies</text>
      <text x="548" y="537" transform="rotate(-1 548 537)">Pasta</text>
      <text x="548" y="580" transform="rotate(1 548 580)">Coffee</text>
    </g>

    <!-- Spiral binding holes -->
    <g class="solid">
      <circle cx="460" cy="185" r="5" /><circle cx="460" cy="232" r="5" />
      <circle cx="460" cy="279" r="5" /><circle cx="460" cy="326" r="5" />
      <circle cx="460" cy="373" r="5" /><circle cx="460" cy="420" r="5" />
      <circle cx="460" cy="467" r="5" /><circle cx="460" cy="514" r="5" />
      <circle cx="460" cy="561" r="5" />
    </g>

    <!-- Loose oval wire loops -->
    <g class="mid">
      <path d="M461 170C429 166 425 197 457 199C483 201 484 176 461 179" />
      <path d="M461 217C428 213 425 244 457 246C484 248 484 223 461 226" />
      <path d="M461 264C428 260 425 291 457 293C484 295 484 270 461 273" />
      <path d="M461 311C428 307 425 338 457 340C484 342 484 317 461 320" />
      <path d="M461 358C428 354 425 385 457 387C484 389 484 364 461 367" />
      <path d="M461 405C428 401 425 432 457 434C484 436 484 411 461 414" />
      <path d="M461 452C428 448 425 479 457 481C484 483 484 458 461 461" />
      <path d="M461 499C428 495 425 526 457 528C484 530 484 505 461 508" />
      <path d="M461 546C428 542 425 573 457 575C484 577 484 552 461 555" />
    </g>
  </g>

  <!-- Smiling milk carton -->
